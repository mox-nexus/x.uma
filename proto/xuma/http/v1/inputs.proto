syntax = "proto3";

package xuma.http.v1;

option java_package = "io.xuma.http.v1";
option java_outer_classname = "InputsProto";
option java_multiple_files = true;

// Extracts an HTTP header value by name.
message HeaderInput {
  // Header name to extract (case-insensitive).
  string name = 1;
}

// Extracts the HTTP request path.
message PathInput {}

// Extracts the HTTP request method.
message MethodInput {}

// Extracts a query parameter value by name.
message QueryParamInput {
  // Query parameter name.
  string name = 1;
}

// Extracts the HTTP authority — the :authority pseudo-header, or Host in
// HTTP/1. Named for what the code registers: this message was `HostInput`
// while the registry advertised `xuma.http.v1.AuthorityInput`, so the schema
// and the type URL named different things.
message AuthorityInput {}

// Extracts the HTTP scheme (http/https).
message SchemeInput {}
