syntax = "proto3";

package xuma.kv.v1;

option java_package = "io.xuma.kv.v1";
option java_outer_classname = "InputsProto";
option java_multiple_files = true;

// Reads one entry from a string-to-string map.
//
// The key-value domain is the simplest matching domain x.uma has, and the one
// the `rumi` CLI uses by default. This message used to live in `xuma.test.v1`
// as `StringInput`, whose only field was named `value` while the code used it
// as a lookup key — a config that read `key:` against a schema that said
// `value`. The concept was never "test", and it was never a value.
message MapInput {
  // Which entry to read. Required in practice: an empty key reads nothing, so
  // the predicate is always false. proto3 cannot express that, so the
  // constructor rejects it.
  string key = 1;
}
