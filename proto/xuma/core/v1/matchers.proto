syntax = "proto3";

package xuma.core.v1;

option java_package = "io.xuma.core.v1";
option java_outer_classname = "MatchersProto";
option java_multiple_files = true;

// Matches a boolean value.
//
// Reachable through a `customMatch`, which is the seam for comparisons xDS's
// own `StringMatcher` cannot express — and a boolean is one, since `valueMatch`
// only compares strings.
//
// No input x.uma ships produces a boolean; this exists for a custom domain
// whose `DataInput` returns `MatchingData::Bool`. It was registered under this
// type URL for months with no message behind it, so `rumi info` advertised it
// and every config naming it failed to load.
message BoolMatcher {
  // The boolean value to match against.
  bool expected = 1;
}
