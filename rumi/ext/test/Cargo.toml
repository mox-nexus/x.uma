[package]
name = "rumi-test"
description = "Conformance fixture loading for the x.uma test suite"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
fixtures = ["serde", "serde_yaml", "serde_json"]
registry = ["rumi-core/registry", "rumi-kv/registry", "serde", "dep:rumi-proto", "dep:rumi-http"]

[dependencies]
rumi-core.workspace = true
rumi-kv = { path = "../kv", version = "0.0.2" }
# The protojson fixtures cover the HTTP domain through the config path; the
# `05_http` dialect covers it through the compiler.
rumi-http = { path = "../http", version = "0.0.2", default-features = false, features = ["registry", "message"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }
rumi-proto = { path = "../../proto", version = "0.0.2", optional = true }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
