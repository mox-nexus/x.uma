[package]
name = "rumi-http"
description = "HTTP matching domain for rumi — method, path, headers, query parameters"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["xds", "matcher", "http", "envoy", "gateway"]
categories = ["config", "web-programming"]

[features]
# default = [] deliberately. `ext-proc` used to be on by default and pulled 101
# crates against 7 — tokio, tonic, axum, hyper, h2, two major versions of http —
# into a library that never opens a socket. Its heaviest root, envoy-grpc-ext-proc,
# had 1,121 total downloads and a single third-party maintainer. Every consumer
# in this repo already passed --no-default-features, which is the tell: the
# project never used its own default. Feature defaults freeze at first publish.
default = []

# The domain: HttpMessage, its DataInputs, and the query/path helpers. No
# dependencies at all — it is a HashMap and five Options. Everything else is an
# adapter onto it, which is what makes the two below siblings rather than a
# chain.
message = []

# Gateway API config types and compile_route_matches. Config, not transport.
gateway = ["message", "dep:k8s-gateway-api", "dep:k8s-openapi"]

# Envoy ext_proc data-plane types, and From<ProcessingRequest> for HttpMessage.
# Deliberately does NOT imply `gateway`: an ext_proc filter has no use for
# Kubernetes config types, and making one adapter depend on its sibling is the
# same conflation this split exists to remove.
ext-proc = ["message", "dep:envoy-grpc-ext-proc"]

# Config loading, from the generated proto types and nothing else.
#
# There used to be a separate `proto` feature that swapped the config types out
# from under `registry`. It was not additive — enabling it deleted two public
# config types and replaced six impls, and one replacement turned a required
# field into `unwrap_or_default()`, so a header deny rule silently stopped
# firing. There is now one vocabulary and no feature that selects a vocabulary,
# which is what makes the violation inexpressible rather than merely absent.
registry = ["message", "rumi-core/registry", "serde", "dep:rumi-proto"]

[dependencies]
rumi-core.workspace = true
serde = { workspace = true, optional = true }
rumi-proto = { path = "../../proto", version = "0.0.2", optional = true }

# ext_proc types (ProcessingRequest, ProcessingResponse, etc.)
envoy-grpc-ext-proc = { version = "0.1", optional = true }

# Gateway API types (HttpRouteMatch, HttpPathMatch, etc.)
k8s-gateway-api = { version = "0.16", optional = true }

# k8s-openapi needs a version feature enabled
k8s-openapi = { version = "0.20", features = ["v1_28"], optional = true }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
