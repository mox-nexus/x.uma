[package]
name = "rumi-http"
description = "HTTP matching domain for rumi — method, path, headers, query parameters"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["xds", "matcher", "http", "envoy", "gateway"]
categories = ["config", "web-programming"]

[features]
# Empty deliberately: `ext-proc` pulls in tokio, tonic and hyper, which a
# library that never opens a socket should not carry unless asked. Feature
# defaults freeze at first publish.
default = []

# The domain itself, HttpMessage and its DataInputs, is not a feature: it has
# no dependencies, and it is the crate's one context (D-059). Everything below
# is an adapter onto it, which is what makes them siblings rather than a chain.

# Gateway API config types and compile_route_matches. Config, not transport.
gateway = ["dep:k8s-gateway-api", "dep:k8s-openapi"]

# Envoy ext_proc data-plane types, and From<ProcessingRequest> for HttpMessage.
# Deliberately does NOT imply `gateway`: an ext_proc filter has no use for
# Kubernetes config types, and making one adapter depend on its sibling is the
# same conflation this split exists to remove.
ext-proc = ["dep:envoy-grpc-ext-proc"]

# Config loading, from the generated proto types. There is one config
# vocabulary, so there is deliberately no feature that selects one: such a
# feature cannot be additive.
registry = ["rumi-core/registry", "dep:rumi-proto"]

[dependencies]
rumi-core.workspace = true
rumi-proto = { path = "../../proto", version = "0.0.2", optional = true }

# ext_proc types (ProcessingRequest, ProcessingResponse, etc.)
envoy-grpc-ext-proc = { version = "0.1", optional = true }

# Gateway API types (HttpRouteMatch, HttpPathMatch, etc.)
k8s-gateway-api = { version = "0.16", optional = true }

# k8s-openapi needs a version feature enabled
k8s-openapi = { version = "0.20", features = ["v1_28"], optional = true }

[dev-dependencies]
serde_json.workspace = true
