[package]
name = "rumi-kv"
description = "Key-value matching domain for rumi — match on a string map"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["xds", "matcher", "envoy", "key-value", "config"]
categories = ["config"]
readme = "README.md"

[features]
default = []

# Config loading. There is exactly one config vocabulary — the generated proto
# types — so `registry` pulls them directly. There is deliberately no `proto`
# feature: a feature that chose between two vocabularies is what made
# `#[cfg(all(feature = "registry", not(feature = "proto")))]` writable, and the
# fix is to leave nothing for it to choose between.
registry = ["rumi-core/registry", "serde", "dep:rumi-proto"]
serde = ["dep:serde"]

[dependencies]
rumi-core.workspace = true
serde = { workspace = true, optional = true }
rumi-proto = { path = "../../proto", version = "0.0.2", optional = true }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
