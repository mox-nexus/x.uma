[package]
name = "rumi-kv"
description = "Key-value matching domain for rumi — match on a string map"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["xds", "matcher", "envoy", "key-value", "config"]
categories = ["config"]
readme = "README.md"

[features]
default = []
registry = ["rumi-core/registry", "serde"]
serde = ["dep:serde"]
proto = ["registry", "dep:rumi-proto"]

[dependencies]
rumi-core.workspace = true
serde = { workspace = true, optional = true }
rumi-proto = { path = "../../proto", version = "0.0.2", optional = true }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
