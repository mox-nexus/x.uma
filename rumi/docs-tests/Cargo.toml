[package]
name = "rumi-docs-tests"
description = "Compiles the Rust snippets in docs/content so they cannot rot"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]

[dev-dependencies]
rumi-core = { workspace = true, features = ["registry", "claude"] }
# "gateway", not "ext-proc": the docs use compile_route_matches and the
# Gateway API types, not the data plane. This crate previously pinned
# ext-proc, which unified it into every workspace build and masked the fact
# that a gateway-only build did not compile.
rumi-http = { path = "../ext/http", features = ["registry", "gateway"], default-features = false }
rumi-proto = { path = "../proto" }
serde_yaml.workspace = true
serde_json.workspace = true
