[package]
name = "rumi-proto"
description = "xDS and xuma proto types for rumi, with Any resolution and Matcher conversion"
keywords = ["xds", "protobuf", "envoy", "matcher", "prost"]
categories = ["config", "encoding"]
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
prost = "0.13"
pbjson = "0.7"
serde = { workspace = true }
serde_json = { workspace = true }
rumi-core = { workspace = true, features = ["registry"] }

# Alias pbjson-types as prost_types so generated code using ::prost_types::Any
# gets serde::Serialize/Deserialize impls (needed for prost-serde compat)
[dependencies.prost_types]
package = "pbjson-types"
version = "0.7"

[dev-dependencies]
# Dev-only: convert.rs's end-to-end tests evaluate against the kv domain.
rumi-kv = { path = "../ext/kv", features = ["registry"] }
rumi-test = { path = "../ext/test", features = ["fixtures"] }
