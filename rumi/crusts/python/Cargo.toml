[package]
name = "xuma-crust-python"
description = "Python bindings for rumi via PyO3"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "xuma_crust"
crate-type = ["cdylib", "lib"]

[features]
# Off by default, so the published artifact carries no YAML fixture loader.
# The conformance suite builds with it; consumers never do. PLAN.md E3.
default = []
# Running the protojson conformance suite.
fixtures = ["dep:rumi-test"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
rumi-core = { path = "../../core", features = ["registry", "claude"] }
rumi-http = { path = "../../ext/http", default-features = false, features = ["registry"] }
# rumi-kv, not rumi-test: a YAML fixture loader has no business inside a
# shipped wheel/npm package (PLAN.md E3).
rumi-kv = { path = "../../ext/kv", features = ["registry"] }
rumi-test = { path = "../../ext/test", features = ["registry", "fixtures"], optional = true }
# Config loading. The config format is protojson (DECISIONS.md D-026), and
# from_config() uses it whether or not the fixtures feature is on.
rumi-proto = { path = "../../proto", version = "0.0.2" }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

[dev-dependencies]
# Fixture loading, for running the conformance suite against the bindings.
# Deliberately not a runtime dependency: a YAML loader has no business
# inside a shipped wheel or npm package.
rumi-test = { path = "../../ext/test", features = ["registry", "fixtures"] }
