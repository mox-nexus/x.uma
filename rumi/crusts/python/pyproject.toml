[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "xuma-crust"
description = "Rust-backed bindings for the x.uma matcher engine"
license = "MIT OR Apache-2.0"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
readme = "README.md"
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/mox-nexus/x.uma"
Documentation = "https://mox-nexus.github.io/x.uma/"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "xuma_crust"

[dependency-groups]
dev = [
    # maturin is in [build-system].requires, which uv resolves in an isolated
    # build env — it is not installed into the venv, so `uv run maturin` cannot
    # find it. CI needs it present to build the extension before the doc
    # samples import it.
    "maturin>=1.0,<2.0",
    "pytest>=8.0",
    "pytest-benchmark>=5.0",
    # The getting-started page loads routes.yaml before handing protojson to
    # HttpMatcher.from_config; the doc-sample gate needs the same parser a
    # reader would install. Not a runtime dependency of xuma-crust.
    "pyyaml>=6.0",
    "xuma @ file:///${PROJECT_ROOT}/../../../puma",
]
