[package]
name = "rumi-core"
description = "Rust implementation of xDS Unified Matcher API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["xds", "matcher", "envoy", "config"]
categories = ["config", "data-structures"]

[lib]
name = "rumi"

[features]
# Config loading is the whole pitch, and it was opt-in behind an undocumented
# flag: `cargo add rumi-core` then pasting the README example did not compile,
# because Registry and MatcherConfig are gated. The cost is serde + serde_json
# in core, which is the price of the advertised feature. Feature defaults freeze
# at first publish, so this is the last free moment to fix it.
default = ["registry"]
serde = ["dep:serde"]
registry = ["serde", "dep:serde_json"]
claude = ["serde"]

[dependencies]
regex = "1"  # Linear-time regex (RE2 semantics, ReDoS-safe)
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
# Dev-only: the config bench needs a concrete domain to measure against.
# A dev-dependency cycle back onto a dependent crate is allowed by cargo.
rumi-kv = { path = "../ext/kv", features = ["registry"] }
divan = "0.1"
rumi-test = { path = "../ext/test", features = ["registry"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true

[[bench]]
name = "evaluate"
harness = false

[[bench]]
name = "compile"
harness = false

[[bench]]
name = "redos"
harness = false

[[bench]]
name = "config"
harness = false
required-features = ["registry"]
