name: "http_multiple_routes_or"
description: "Multiple HttpRouteMatch entries are ORed together"

# Multiple route matches - any can match
http_route_matches:
  - path:
      type: Exact
      value: "/health"
  - path:
      type: Exact
      value: "/ready"
  - path:
      type: Exact
      value: "/live"

action: "probe_endpoint"

cases:
  - name: "first_route_matches"
    http_request:
      method: GET
      path: /health
    expect: "probe_endpoint"

  - name: "second_route_matches"
    http_request:
      method: GET
      path: /ready
    expect: "probe_endpoint"

  - name: "third_route_matches"
    http_request:
      method: GET
      path: /live
    expect: "probe_endpoint"

  - name: "no_route_matches"
    http_request:
      method: GET
      path: /other
    expect: null

---
name: "http_routes_with_fallback"
description: "Multiple routes with on_no_match fallback"

http_route_matches:
  - path:
      type: PathPrefix
      value: "/api"

action: "api_backend"
on_no_match: "default_backend"

cases:
  - name: "route_matches"
    http_request:
      method: GET
      path: /api/users
    expect: "api_backend"

  - name: "no_match_falls_back"
    http_request:
      method: GET
      path: /other
    expect: "default_backend"

---
name: "http_complex_routes_or"
description: "Complex routes with different conditions ORed"

http_route_matches:
  - path:
      type: PathPrefix
      value: "/api"
    method: GET
  - path:
      type: PathPrefix
      value: "/api"
    method: POST
    headers:
      - type: Exact
        name: content-type
        value: "application/json"

action: "api_handler"

cases:
  - name: "first_route_get"
    http_request:
      method: GET
      path: /api/users
    expect: "api_handler"

  - name: "second_route_post_json"
    http_request:
      method: POST
      path: /api/users
      headers:
        content-type: "application/json"
    expect: "api_handler"

  - name: "post_without_json_no_match"
    http_request:
      method: POST
      path: /api/users
      headers:
        content-type: "text/plain"
    expect: null

  - name: "delete_no_match"
    http_request:
      method: DELETE
      path: /api/users
    expect: null

---
name: "http_empty_routes_is_refused"
description: |
  An empty route-matches array must be refused, not treated as a catch-all.

  This fixture asserted the opposite until 2026-08-31, and that made the
  fail-open a cross-language *contract* rather than an oversight: every
  implementation was conformant precisely by matching everything.

  Two things are wrong with the old behaviour. xDS is explicit that an empty
  matcher list is a no-match — "if no matcher above matched and this field is
  not populated, the match will be considered unsuccessful" — and the config
  path has always honoured that; only the Gateway API compiler disagreed with
  the engine underneath it. And the polarity of the mistake is caller-supplied:
  `([], "allow", "deny")` and `([], "deny", "allow")` are opposite outcomes
  from the same empty input, so the library cannot pick a safe one. An empty
  list is also almost never written on purpose — it is a config that failed to
  load, or a filter that removed every rule.

  A catch-all stays reachable through `compile_catch_all`, by name.

http_route_matches: []

action: "catch_all"

expect_error: true
error_contains: "no route matches"

cases: []
