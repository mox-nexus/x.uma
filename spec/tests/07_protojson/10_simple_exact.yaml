---
name: simple_exact
description: Single field matcher with exact string match via config loading
implementations:
- rust
proto_matcher:
  matcherList:
    matchers:
    - predicate:
        singlePredicate:
          input:
            name: MapInput
            typedConfig:
              '@type': type.googleapis.com/xuma.kv.v1.MapInput
              key: name
          valueMatch:
            exact: alice
      onMatch:
        action:
          name: matched
          typedConfig:
            '@type': type.googleapis.com/xuma.core.v1.NamedAction
            name: matched
  onNoMatch:
    action:
      name: default
      typedConfig:
        '@type': type.googleapis.com/xuma.core.v1.NamedAction
        name: default
cases:
- name: exact_hit
  context:
    name: alice
  expect: matched
- name: exact_miss
  context:
    name: bob
  expect: default
- name: missing_key_falls_through
  context:
    other: alice
  expect: default

