---
name: and_predicate
description: 'Compound AND predicate: all conditions must match'
implementations:
- rust
- python
proto_matcher:
  matcherList:
    matchers:
    - predicate:
        andMatcher:
          predicate:
          - singlePredicate:
              input:
                name: MapInput
                typedConfig:
                  '@type': type.googleapis.com/xuma.kv.v1.MapInput
                  key: role
              valueMatch:
                exact: admin
          - singlePredicate:
              input:
                name: MapInput
                typedConfig:
                  '@type': type.googleapis.com/xuma.kv.v1.MapInput
                  key: org
              valueMatch:
                prefix: acme
      onMatch:
        action:
          name: admin_acme
          typedConfig:
            '@type': type.googleapis.com/xuma.core.v1.NamedAction
            name: admin_acme
cases:
- name: both_match
  context:
    role: admin
    org: acme-corp
  expect: admin_acme
- name: first_fails
  context:
    role: viewer
    org: acme-corp
  expect: null
- name: second_fails
  context:
    role: admin
    org: other
  expect: null
- name: both_fail
  context:
    role: viewer
    org: other
  expect: null

---
name: or_predicate
description: 'Compound OR predicate: any condition must match'
implementations:
- rust
- python
proto_matcher:
  matcherList:
    matchers:
    - predicate:
        orMatcher:
          predicate:
          - singlePredicate:
              input:
                name: MapInput
                typedConfig:
                  '@type': type.googleapis.com/xuma.kv.v1.MapInput
                  key: role
              valueMatch:
                exact: admin
          - singlePredicate:
              input:
                name: MapInput
                typedConfig:
                  '@type': type.googleapis.com/xuma.kv.v1.MapInput
                  key: role
              valueMatch:
                exact: superadmin
      onMatch:
        action:
          name: elevated
          typedConfig:
            '@type': type.googleapis.com/xuma.core.v1.NamedAction
            name: elevated
cases:
- name: first_matches
  context:
    role: admin
  expect: elevated
- name: second_matches
  context:
    role: superadmin
  expect: elevated
- name: neither_matches
  context:
    role: viewer
  expect: null

---
name: not_predicate
description: 'NOT predicate: inverts the inner condition'
implementations:
- rust
- python
proto_matcher:
  matcherList:
    matchers:
    - predicate:
        notMatcher:
          singlePredicate:
            input:
              name: MapInput
              typedConfig:
                '@type': type.googleapis.com/xuma.kv.v1.MapInput
                key: env
            valueMatch:
              exact: production
      onMatch:
        action:
          name: non_prod
          typedConfig:
            '@type': type.googleapis.com/xuma.core.v1.NamedAction
            name: non_prod
cases:
- name: not_production
  context:
    env: staging
  expect: non_prod
- name: is_production
  context:
    env: production
  expect: null
- name: missing_key_not_matches
  context:
    other: x
  expect: non_prod

