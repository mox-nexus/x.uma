                - *role
                - *role
        /y:
          matcher: *hundred
        /z:
          matcher: *hundred
  onNoMatch:
    action:
      name: fallback
      typedConfig:
        "@type": type.googleapis.com/xuma.core.v1.NamedAction
        name: fallback
cases:
  - name: an_entry_evaluates_its_own_list
    context: { path: /y, role: admin }
    expect: allow
  - name: a_miss_under_the_entry_falls_to_on_no_match
    context: { path: /y, role: viewer }
    expect: fallback
  - name: an_unknown_key_falls_to_on_no_match
    context: { path: /w, role: admin }
    expect: fallback

