name: budget_aggregate_leaves
description: >
  Every leaf predicate is a per-request cost, and the per-list bound of 256
  does not add up across nesting: three nested lists of a hundred are each
  under it and together are not. The budget is the total over the root
  matcher (D-054), and it is checked while the document is being loaded, so
  the refusal names the leaf that crossed it, not the size of what was
  materialised afterwards.
implementations: [rust, python, typescript]
proto_matcher:
  matcherList:
    matchers:
    - predicate:
        singlePredicate:
          input:
            name: tenant
            typedConfig:
              "@type": type.googleapis.com/xuma.kv.v1.MapInput
              key: tenant
          valueMatch:
            exact: t0
      onMatch:
        matcher:
          matcherList:
            matchers:
              - &leaf
                predicate:
                  singlePredicate:
                    input:
                      name: role
                      typedConfig:
                        "@type": type.googleapis.com/xuma.kv.v1.MapInput
                        key: role
                    valueMatch:
                      exact: admin
                onMatch:
                  action:
                    name: allow
                    typedConfig:
                      "@type": type.googleapis.com/xuma.core.v1.NamedAction
                      name: allow
              - *leaf
              - *leaf
              - *leaf
