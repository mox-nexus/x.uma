name: budget_list_rules_add_up
description: >
  A list's rules lie on one path: a nested matcher that misses hands
  evaluation on to the next rule, so one request can reach the tenant check of
  every rule and each nested list beneath it. Three rules of one predicate,
  each over a nested list of a hundred, cost 303 predicates in one evaluation,
  past the budget of 256 (D-068). Each list on its own is well under it.
implementations: [rust, python, typescript]
proto_matcher:
  matcherList:
    matchers:
    - predicate:
        singlePredicate:
          input:
            name: tenant
            typedConfig:
              "@type": type.googleapis.com/xuma.kv.v1.MapInput
              key: tenant
          valueMatch:
            exact: t0
      onMatch:
        matcher:
