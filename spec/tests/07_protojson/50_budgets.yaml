name: budget_regex_memory
description: >
  A compiled regex holds memory the engine bounds per pattern; the count of
  them is bounded per document (D-054). Two nested lists of a hundred and
  fifty regex rules are each under the per-list bound and together over the
  regex budget. The refusal names the regex that crossed the budget, one
  past it, which is the proof that the check runs during the walk rather
  than after every pattern has been compiled.
implementations: [rust, python, typescript]
proto_matcher:
  matcherList:
    matchers:
    - predicate:
        singlePredicate:
          input:
            name: tenant
            typedConfig:
              "@type": type.googleapis.com/xuma.kv.v1.MapInput
              key: tenant
          valueMatch:
            exact: t0
      onMatch:
        matcher:
          matcherList:
