name: budget_tree_entries_do_not_add_up
description: >
  A tree looks up one entry per request, so the entries' costs do not add up:
  three entries over a hundred predicates each hold three hundred in the
  document and cost a hundred in any one evaluation. The document loads
  (D-068). Under D-054's budget, which summed every leaf in the document, it
  was refused, which capped every tree at 256 single-rule entries and closed
  the path D-054 itself named for rule sets at scale.
implementations: [rust, python, typescript]
proto_matcher:
  matcherTree:
    input:
      name: path
      typedConfig:
        "@type": type.googleapis.com/xuma.kv.v1.MapInput
        key: path
    exactMatchMap:
      map:
        /x:
          matcher: &hundred
            matcherList:
              matchers:
                - &role
                  predicate:
                    singlePredicate:
                      input:
                        name: role
                        typedConfig:
                          "@type": type.googleapis.com/xuma.kv.v1.MapInput
                          key: role
                      valueMatch:
                        exact: admin
                  onMatch:
                    action:
                      name: allow
                      typedConfig:
                        "@type": type.googleapis.com/xuma.core.v1.NamedAction
                        name: allow
                - *role
                - *role
                - *role
                - *role
                - *role
                - *role
                - *role
