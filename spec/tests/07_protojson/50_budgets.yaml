name: budget_regex_memory
description: >
  A compiled regex holds memory the engine bounds per pattern; the count of
  them is bounded per document (D-054). Two nested lists of a hundred and
  fifty regex rules hold three hundred regexes, past the budget of 64. The
  refusal names the regex that crossed the budget, one
  past it, which is the proof that the check runs during the walk rather
  than after every pattern has been compiled.
