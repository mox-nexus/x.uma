                      name: path
                      typedConfig:
                        "@type": type.googleapis.com/xuma.kv.v1.MapInput
                        key: path
                    valueMatch:
                      safeRegex:
                        regex: ^/api/v[0-9]+/users/[0-9]+$
                onMatch:
                  action:
                    name: api
                    typedConfig:
                      "@type": type.googleapis.com/xuma.core.v1.NamedAction
                      name: api
