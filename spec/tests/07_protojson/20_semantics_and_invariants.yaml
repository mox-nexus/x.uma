description: Tests that nested matcher failure propagates to next field_matcher
implementations:
- rust
- python
- typescript
proto_matcher:
  matcherList:
    matchers:
    - predicate:
        singlePredicate:
          input:
            name: tier
            typedConfig:
              '@type': type.googleapis.com/xuma.kv.v1.MapInput
              key: tier
          valueMatch:
            exact: premium
      onMatch:
        matcher:
          matcherList:
            matchers:
            - predicate:
                singlePredicate:
                  input:
                    name: feature
                    typedConfig:
                      '@type': type.googleapis.com/xuma.kv.v1.MapInput
                      key: feature
                  valueMatch:
                    exact: analytics
              onMatch:
                action:
                  name: premium_analytics
                  typedConfig:
                    '@type': type.googleapis.com/xuma.core.v1.NamedAction
                    name: premium_analytics
    - predicate:
        singlePredicate:
          input:
            name: tier
            typedConfig:
              '@type': type.googleapis.com/xuma.kv.v1.MapInput
              key: tier
          valueMatch:
