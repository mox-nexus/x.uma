---
name: exact_via_config
description: Exact string match via config loading
implementations:
- rust
proto_matcher:
  matcherList:
    matchers:
    - predicate:
        singlePredicate:
          input:
            name: MapInput
            typedConfig:
              '@type': type.googleapis.com/xuma.kv.v1.MapInput
              key: v
          valueMatch:
            exact: hello
      onMatch:
        action:
          name: hit
          typedConfig:
            '@type': type.googleapis.com/xuma.core.v1.NamedAction
            name: hit
cases:
- name: exact_hit
  context:
    v: hello
  expect: hit
- name: exact_miss
  context:
    v: Hello
  expect: null

