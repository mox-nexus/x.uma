---
name: regex_via_config
description: Regex string match via config loading
implementations:
- rust
proto_matcher:
  matcherList:
    matchers:
    - predicate:
        singlePredicate:
          input:
            name: MapInput
            typedConfig:
              '@type': type.googleapis.com/xuma.kv.v1.MapInput
              key: v
          valueMatch:
            safeRegex:
              regex: ^user-\d+$
      onMatch:
        action:
          name: hit
          typedConfig:
            '@type': type.googleapis.com/xuma.core.v1.NamedAction
            name: hit
cases:
- name: regex_hit
  context:
    v: user-123
  expect: hit
- name: regex_miss
  context:
    v: user-abc
  expect: null

