name: "protojson_simple_exact"
description: >
  The smallest canonical protojson matcher: one predicate, one action.

  This is the format x.uma actually implements — protobuf's canonical JSON
  mapping of xds.type.matcher.v3.Matcher — rather than a dialect that exists
  nowhere but this repo. See DECISIONS.md D-026.

implementations: [rust, python, typescript]

proto_matcher:
  matcherList:
    matchers:
      - predicate:
          singlePredicate:
            input:
              name: role
              typedConfig:
                "@type": type.googleapis.com/xuma.kv.v1.MapInput
                key: role
            valueMatch:
              exact: admin
        onMatch:
          action:
            name: allow
            typedConfig:
              "@type": type.googleapis.com/xuma.core.v1.NamedAction
              name: allow

cases:
  - name: "matches"
    context: { role: admin }
    expect: "allow"
  - name: "does_not_match"
    context: { role: viewer }
    expect: null
  - name: "absent_input_is_false_not_an_error"
    context: {}
    expect: null

---
name: "protojson_ignore_case"
description: >
  ignoreCase reaches the matcher. It was read from the proto and discarded
  until 2026-08-18, so a rule that read case-insensitive matched
  case-sensitively — PLAN.md F6 / SF1.

implementations: [rust, python, typescript]

proto_matcher:
  matcherList:
    matchers:
      - predicate:
          singlePredicate:
            input:
              name: role
              typedConfig:
                "@type": type.googleapis.com/xuma.kv.v1.MapInput
                key: role
            valueMatch:
              exact: admin
              ignoreCase: true
        onMatch:
          action:
            name: allow
            typedConfig:
              "@type": type.googleapis.com/xuma.core.v1.NamedAction
              name: allow

cases:
  - name: "matches_exact"
    context: { role: admin }
    expect: "allow"
  - name: "matches_shouting"
    context: { role: ADMIN }
    expect: "allow"
  - name: "matches_mixed"
    context: { role: AdMiN }
    expect: "allow"
  - name: "still_does_not_match_a_different_value"
    context: { role: viewer }
    expect: null

---
name: "protojson_rejects_an_unknown_field"
description: >
  A typo'd field is a load error, not a silently ignored one. The hand-written
  config types carried no deny_unknown_fields, so a misspelled key in a deny
  rule produced a rule that never fired. Every generated deserializer rejects
  unknown fields, which extends SECURITY.md control #6 to the whole config
  surface.

implementations: [rust, python, typescript]
expect_error: true

proto_matcher:
  matcherList:
    matchers:
      - predicate:
          singlePredicate:
            input:
              name: role
              typedConfig:
                "@type": type.googleapis.com/xuma.kv.v1.MapInput
                kye: role
            valueMatch:
              exact: admin
        onMatch:
          action:
            name: allow
            typedConfig:
              "@type": type.googleapis.com/xuma.core.v1.NamedAction
              name: allow

---
name: "protojson_refuses_keep_matching"
description: >
  keep_matching records the action and continues evaluating in xDS; this engine
  returns the first match. Accepting the field and ignoring it answers a
  different question than the config asked — PLAN.md F2 / SF2.

implementations: [rust, python, typescript]
expect_error: true

proto_matcher:
  matcherList:
    matchers:
      - predicate:
          singlePredicate:
            input:
              name: role
              typedConfig:
                "@type": type.googleapis.com/xuma.kv.v1.MapInput
                key: role
            valueMatch:
              exact: admin
        onMatch:
          keepMatching: true
          action:
            name: allow
            typedConfig:
              "@type": type.googleapis.com/xuma.core.v1.NamedAction
              name: allow

---
name: "protojson_action_metadata_round_trips"
description: >
  NamedAction.metadata is a map<string, string>, and the config path encodes
  every Any payload to protobuf binary and back. This is the only fixture that
  exercises a map through that round trip, which D-034's identity claim rests
  on.

  The `@type` key is deliberate. The packing walk stops at the first `@type` and
  never descends into a payload body — precisely so that a rule whose metadata
  uses that key is not mistaken for a nested Any. A walk that descended would
  corrupt this rule rather than fail on it.

implementations: [rust, python, typescript]

proto_matcher:
  matcherList:
    matchers:
      - predicate:
          singlePredicate:
            input:
              name: role
              typedConfig:
                "@type": type.googleapis.com/xuma.kv.v1.MapInput
                key: role
            valueMatch:
              exact: admin
        onMatch:
          action:
            name: allow
            typedConfig:
              "@type": type.googleapis.com/xuma.core.v1.NamedAction
              name: allow
              metadata:
                owner: platform-team
                ticket: "SEC-1421"
                "@type": not-a-type-url

cases:
  - name: "the_rule_still_fires"
    context: { role: admin }
    expect: "allow"
  - name: "and_still_does_not_over-match"
    context: { role: viewer }
    expect: null

---
name: "protojson_incompatible_input_and_matcher"
description: >
  A `customMatch` pairing a string-producing input with a boolean matcher is a
  load error, in every implementation.

  This is the only fixture that reaches `xuma.core.v1.BoolMatcher`: no shipped
  input produces a boolean, so there is no positive case to write in the
  key-value domain. What it pins is the type-compatibility check itself —
  `data_type` against `supported_types`, validated when the config loads rather
  than discovered as a rule that silently never fires.

  It could not be written until 2026-08-18: rumi had checked this since the
  beginning and puma and bumi had not, so the same config was a load error in
  one implementation and a no-op in the other two.

implementations: [rust, python, typescript]
expect_error: true
error_contains: "but matcher supports"

proto_matcher:
  matcherList:
    matchers:
      - predicate:
          singlePredicate:
            input:
              name: flag
              typedConfig:
                "@type": type.googleapis.com/xuma.kv.v1.MapInput
                key: flag
            customMatch:
              name: bool
              typedConfig:
                "@type": type.googleapis.com/xuma.core.v1.BoolMatcher
                expected: true
        onMatch:
          action:
            name: hit
            typedConfig:
              "@type": type.googleapis.com/xuma.core.v1.NamedAction
              name: hit
