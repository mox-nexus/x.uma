name: CI

# Nothing ran the test suites on push or PR before this workflow existed.
# Every command below is one that `just` runs locally, so green here means the
# same thing as green on a laptop.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (rumi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rumi

      - name: Format
        run: cargo fmt --manifest-path rumi/Cargo.toml --all -- --check

      # --all-targets covers test and bench code, where dead scaffolding hides.
      - name: Clippy
        run: cargo clippy --manifest-path rumi/Cargo.toml --all-targets -- -D warnings

      - name: Build
        run: cargo build --manifest-path rumi/Cargo.toml

      - name: Test
        run: cargo test --manifest-path rumi/Cargo.toml

      # rumi-proto is outside default-members, so the step above never sees it.
      # It went its whole life uncompiled because nothing ran this (PLAN.md F1).
      - name: Test rumi-proto
        run: cargo test --manifest-path rumi/Cargo.toml -p rumi-proto

      - name: Conformance fixtures
        run: cargo test --manifest-path rumi/Cargo.toml -p rumi-test --test conformance --features rumi-test/fixtures

  python:
    name: python (puma)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync
        working-directory: puma
        run: uv sync --all-groups

      - name: Lint
        working-directory: puma
        run: uv run ruff check .

      - name: Type-check
        working-directory: puma
        run: uv run mypy src/xuma

      - name: Test
        working-directory: puma
        run: uv run pytest -q

  typescript:
    name: typescript (bumi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install
        working-directory: bumi
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: bumi
        run: bun run lint

      - name: Type-check
        working-directory: bumi
        run: bun run typecheck

      - name: Test
        working-directory: bumi
        run: bun test

      # Guards the published shape: dist/ must emit .js + .d.ts with rewritten
      # import specifiers, or consumers cannot type-check against the package.
      - name: Build publishable output
        working-directory: bumi
        run: bun run build

  docs:
    name: docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Build bumi
        working-directory: bumi
        run: bun install --frozen-lockfile && bun run build

      - name: Install
        working-directory: docs/experience
        run: bun install

      - name: Type-check
        working-directory: docs/experience
        run: bun run check

      # `build` runs scripts/verify-base-path.mjs, so a base-path mistake fails
      # here rather than shipping a blank page.
      - name: Build
        working-directory: docs/experience
        env:
          BASE_PATH: /x.uma
        run: bun run build

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The workspace lives in rumi/ and Cargo.lock is intentionally not
      # committed, so resolve the dependency graph before auditing it.
      # generate-lockfile only reads manifests, so the buf-generated
      # rumi-proto sources (not checked in) are not needed.
      - name: Generate lockfile
        run: cargo generate-lockfile --manifest-path rumi/Cargo.toml

      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: rumi
