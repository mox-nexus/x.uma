name: CI

# Nothing ran the test suites on push or PR before this workflow existed.
# Every command below is one that `just` runs locally, so green here means the
# same thing as green on a laptop.

on:
  push:
    branches: [main]
  # Not `branches: [main]`. Phases are developed as stacked PRs (PLAN.md §1,
  # one PR per phase), and a PR based on another phase branch got ZERO checks
  # under the narrower filter — observed on #24. A stacked PR is exactly where
  # CI matters most, since its base is itself unreviewed.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (rumi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rumi

      - name: Format
        run: cargo fmt --manifest-path rumi/Cargo.toml --all -- --check

      # --all-targets covers test and bench code, where dead scaffolding hides.
      - name: Clippy
        run: cargo clippy --manifest-path rumi/Cargo.toml --all-targets -- -D warnings

      - name: Build
        run: cargo build --manifest-path rumi/Cargo.toml

      - name: Test
        run: cargo test --manifest-path rumi/Cargo.toml

      # rumi-proto is outside default-members, so the step above never sees it.
      # It went its whole life uncompiled because nothing ran this (PLAN.md F1).
      - name: Test rumi-proto
        run: cargo test --manifest-path rumi/Cargo.toml -p rumi-proto

      # Red for months while `just ci` ran default features instead. What it
      # reported was real — see PLAN.md F19.
      - name: Test (all features)
        run: cargo test --manifest-path rumi/Cargo.toml --all-features

      # The crusts are outside default-members and need maturin / wasm-pack to
      # build for real, so they run as their own jobs — which means nothing in
      # this job or in `just ci` noticed when a core change stopped them
      # compiling. That happened three times on 2026-08-18 alone, each found
      # only after pushing. `cargo check` neither links nor builds a cdylib, so
      # it needs none of that toolchain and takes ~3s.
      - name: Crusts still compile
        run: |
          cargo check --manifest-path rumi/crusts/python/Cargo.toml --features fixtures
          cargo check --manifest-path rumi/crusts/wasm/Cargo.toml --features fixtures

      # Not regression detection — no baseline, no threshold, so a benchmark
      # that got 10x slower passes. It catches a benchmark that has stopped
      # measuring anything: panics, a vanished API, a config that no longer
      # parses. `benches/config.rs` spent months timing a config dialect that
      # had been retired, and nothing noticed.
      - name: Benchmarks still run
        run: cargo bench --manifest-path rumi/Cargo.toml --all-features -- --test

      - name: Feature combinations
        run: ./scripts/check-features.sh

      - name: Publishable
        run: node scripts/check-publishable.mjs

      - name: Proto field types round-trip
        run: node scripts/check-proto-field-types.mjs

      # The protojson fixtures, and the ledger of which implementations are
      # expected to run them. Strict in both directions — see proto_fixture.rs.
      - name: Conformance fixtures (protojson)
        run: cargo test --manifest-path rumi/Cargo.toml -p rumi-test --test proto_conformance --features rumi-test/registry,rumi-test/fixtures

      # spec/tests/05_http through the Gateway API compiler. Had runners in
      # puma and bumi and none in the reference implementation until 2026-08-31,
      # while one of its fixtures required a fail-open of everyone. PLAN.md CONF1.
      - name: Conformance fixtures (Gateway API compiler)
        run: cargo test --manifest-path rumi/Cargo.toml -p rumi-test --test http_conformance --features rumi-test/http,rumi-test/fixtures

      # Every config message is fixtured, or listed as a gap with a reason.
      # See DECISIONS.md D-038 for why this check is not optional.
      - name: Fixture coverage spans the schema
        run: cargo test --manifest-path rumi/Cargo.toml -p rumi-test --test fixture_coverage --features rumi-test/registry,rumi-test/fixtures

      # The Rust snippets in docs/content are compiled by rumi-docs-tests, which
      # include!s the Markdown so rustdoc sees them. They were all `rust,ignore`
      # until 2026-08-17, which is how four how-to pages taught APIs that had
      # never existed.
      - name: Doc snippets compile
        run: cargo test --doc --manifest-path rumi/Cargo.toml -p rumi-docs-tests

      - name: Doc commands match --help
        run: node scripts/check-doc-commands.mjs

      - name: Doc links resolve
        run: node scripts/check-doc-links.mjs

  python:
    name: python (puma)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync
        working-directory: puma
        run: uv sync --all-groups

      - name: Lint
        working-directory: puma
        run: uv run ruff check .

      - name: Type-check
        working-directory: puma
        run: uv run mypy src/xuma

      - name: Test
        working-directory: puma
        run: uv run pytest -q

  typescript:
    name: typescript (bumi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install
        working-directory: bumi
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: bumi
        run: bun run lint

      - name: Type-check
        working-directory: bumi
        run: bun run typecheck

      - name: Test
        working-directory: bumi
        run: bun test

      # Guards the published shape: dist/ must emit .js + .d.ts with rewritten
      # import specifiers, or consumers cannot type-check against the package.
      - name: Build publishable output
        working-directory: bumi
        run: bun run build

  docs:
    name: docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Build bumi
        working-directory: bumi
        run: bun install --frozen-lockfile && bun run build

      - name: Install
        working-directory: docs/experience
        run: bun install

      - name: Type-check
        working-directory: docs/experience
        run: bun run check

      # Types are not truth. The playground's diagram drew the fallback branch
      # identically to the match branch and type-checked perfectly; it is the
      # one surface a visitor touches, and it had no tests at all until
      # 2026-09-01.
      - name: Playground tests
        working-directory: docs/experience
        run: bun test tests/

      # `build` runs scripts/verify-base-path.mjs, so a base-path mistake fails
      # here rather than shipping a blank page.
      - name: Build
        working-directory: docs/experience
        env:
          BASE_PATH: /x.uma
        run: bun run build

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cargo.lock is committed (D-031), so there is nothing to resolve first.
      #
      # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml for this job only. The
      # pin is for building x.uma; it should not constrain what version of a
      # CI tool can be installed. It did: cargo-audit's transitive kstring
      # requires rustc 1.96 and the pin forced 1.95, so the job failed to
      # install its own tool.
      - uses: rustsec/audit-check@v2
        env:
          RUSTUP_TOOLCHAIN: stable
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: rumi

  codegen:
    name: codegen is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # PLAN.md CI5. Generated code is committed (DECISIONS.md D-028), which is
      # only honest if regenerating reproduces it exactly. While gen/ was
      # gitignored this check was vacuous by construction, and rumi-proto spent
      # its whole life uncompiled without anything noticing.
      #
      # scripts/gen.sh rather than `just gen`, so this job needs no `just` in
      # CI — the setup action could not resolve a release and failed the job
      # twice. The justfile recipe calls the same script, so there is one source.
      - name: Regenerate
        run: ./scripts/gen.sh

      - name: Assert no drift
        run: |
          if ! git diff --quiet; then
            echo "::error::just gen changed tracked files - generated code is stale, or a plugin pin moved"
            git diff --stat
            git diff | head -100
            exit 1
          fi
          echo "codegen is byte-identical to what is committed"

  crust-python:
    name: crust (PyO3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5

      # PLAN.md F5 / CI1. Two of five shipped implementations were never built
      # by CI. The PyO3 crust has 80 tests that had never run here, in a wheel
      # that goes to PyPI.
      # maturin is a build tool, not a project dependency, so `uv run maturin`
      # cannot find it — it must be installed into the environment first.
      - name: Build and test
        working-directory: rumi/crusts/python
        run: |
          uv sync --all-groups
          uv pip install maturin
          uv run maturin develop --uv --features fixtures
          uv run pytest tests/ -q \
            --ignore=tests/test_bench_config.py --ignore=tests/test_bench_crusty.py

  crust-wasm:
    name: crust (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.15.0

      # 80 more tests, in the package that goes to npm.
      - name: Build and test
        working-directory: rumi/crusts/wasm
        run: |
          wasm-pack build --target web -- --features fixtures
          bun install --frozen-lockfile
          bun test

      # The npm artifact is assembled by wasm-pack, whose generated `files`
      # array omitted both licence files — so a package declaring
      # `MIT OR Apache-2.0` would have shipped with neither. Checked on every
      # PR rather than at release time, because release time is after the
      # version is spent: npm never lets one be re-uploaded.
      - name: The npm tarball is what the package promises
        run: node scripts/pack-wasm-crust.mjs

  agreement:
    name: runtimes agree with the README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - uses: oven-sh/setup-bun@v2

      # PLAN.md CI3. The README says "one config, all runtimes" and shows three
      # code blocks. Nothing checked that they return the same answers — the
      # conformance suite has its own fixtures, and a reader copying from the
      # README is not running it.
      - name: Install deps
        run: |
          uv sync --project puma --all-groups
          bun install --frozen-lockfile

      - name: Evaluate the README config everywhere
        run: node scripts/check-readme-agreement.mjs

  doc-samples:
    name: getting-started and package READMEs run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - uses: oven-sh/setup-bun@v2

      # The Rust blocks in docs/content have been compiled since PR #26. The
      # Python and TypeScript ones never were, and the drift tracked that
      # exactly: `load_http_matcher` / `loadHttpMatcher` were documented on both
      # getting-started pages and in the Python crust's README, and neither
      # function has ever existed. bumi/README.md called `new` on two type-only
      # interfaces. Reading found none of it; running finds all of it.
      #
      # This needs the whole toolchain because the samples import the shipped
      # packages, not the sources — which is the point. A sample checked against
      # anything other than the artifact a reader installs proves nothing.
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.15.0

      - name: Build the wasm crust
        working-directory: rumi/crusts/wasm
        run: |
          wasm-pack build --target web
          bun install --frozen-lockfile

      - name: Build the python crust
        working-directory: rumi/crusts/python
        run: |
          uv sync --all-groups
          uv run maturin develop --uv

      - name: Install pure implementations
        run: |
          uv sync --project puma --all-groups
          bun install --frozen-lockfile
          bun run --cwd bumi build

      # --require-all: an environment skip becomes a failure. "Checked somewhere
      # else" is how the crusts broke three times in one day.
      - name: Every sample runs as written
        run: node scripts/check-doc-samples.mjs --require-all
