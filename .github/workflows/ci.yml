name: CI

# Every check below is one that `just ci` runs locally, so green here means
# the same thing as green on a laptop.

on:
  push:
    branches: [main]
  # Not `branches: [main]`: a stacked PR, based on another branch, would get
  # no checks under that filter, and its base is itself unreviewed.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (rumi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rumi

      - name: Format
        run: cargo fmt --manifest-path rumi/Cargo.toml --all -- --check

      # --all-targets covers test and bench code, where dead scaffolding hides.
      - name: Clippy
        run: cargo clippy --manifest-path rumi/Cargo.toml --all-targets -- -D warnings

      - name: Build
        run: cargo build --manifest-path rumi/Cargo.toml

      - name: Test
        run: cargo test --manifest-path rumi/Cargo.toml

      # rumi-proto is outside default-members, so the step above never sees it.
      - name: Test rumi-proto
        run: cargo test --manifest-path rumi/Cargo.toml -p rumi-proto

      - name: Test (all features)
        run: cargo test --manifest-path rumi/Cargo.toml --all-features

      # The crusts build for real in their own jobs. `cargo check` neither links
      # nor builds a cdylib, so this needs none of their toolchain and fails
      # within seconds when a core change stops them compiling.
      - name: Crusts still compile
        run: |
          cargo check --manifest-path rumi/crusts/python/Cargo.toml --features fixtures,bench
          cargo check --manifest-path rumi/crusts/wasm/Cargo.toml --features fixtures,bench

      # Not regression detection: there is no baseline, so a slower benchmark
      # passes. It catches one that panics, calls a vanished API or carries a
      # config that no longer parses. The crust jobs do the same for theirs.
      - name: Benchmarks still run
        run: cargo bench --manifest-path rumi/Cargo.toml --all-features -- --test

      - name: Feature combinations
        run: ./scripts/check-features.sh

      - name: Publishable
        run: node scripts/check-publishable.mjs

      - name: Proto field types round-trip
        run: node scripts/check-proto-field-types.mjs

      # The protojson fixtures, and the ledger of which implementations are
      # expected to run them. Strict in both directions — see proto_fixture.rs.
      - name: Conformance fixtures (protojson)
        run: cargo test --manifest-path rumi/Cargo.toml -p rumi-test --test proto_conformance --features rumi-test/registry,rumi-test/fixtures

      # spec/tests/05_http through the Gateway API compiler.
      - name: Conformance fixtures (Gateway API compiler)
        run: cargo test --manifest-path rumi/Cargo.toml -p rumi-test --test http_conformance --features rumi-test/http,rumi-test/fixtures

      # Every config message is fixtured, or listed as a gap with a reason.
      # See DECISIONS.md D-038 for why this check is not optional.
      - name: Fixture coverage spans the schema
        run: cargo test --manifest-path rumi/Cargo.toml -p rumi-test --test fixture_coverage --features rumi-test/registry,rumi-test/fixtures

      # The Rust snippets in docs/content are compiled by rumi-docs-tests, which
      # include!s the Markdown so rustdoc sees them.
      - name: Doc snippets compile
        run: cargo test --doc --manifest-path rumi/Cargo.toml -p rumi-docs-tests

      - name: Doc commands match --help
        run: node scripts/check-doc-commands.mjs

      - name: Doc links resolve
        run: node scripts/check-doc-links.mjs

      # Prose cannot fail a build, so the harness's recipe, path and engine
      # names are checked against the tree.
      - name: Harness matches the tree
        run: |
          node scripts/check-harness.mjs --self-test
          node scripts/check-harness.mjs

  docs:
    name: docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rumi

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.15.0

      # The site runs on the engine: the playground and every live example
      # evaluate through the wasm crust, a `file:` dependency that has to exist
      # before the app installs.
      - name: Build the wasm crust
        working-directory: rumi/crusts/wasm
        run: wasm-pack build --target web

      - name: Install
        working-directory: docs/experience
        run: bun install --frozen-lockfile

      - name: Type-check
        working-directory: docs/experience
        run: bun run check

      # Type-checking cannot tell whether the playground's diagram describes
      # the config it was given; these tests can.
      - name: Playground tests
        working-directory: docs/experience
        run: bun test tests/

      # `build` runs scripts/verify-base-path.mjs, so a base-path mistake fails
      # here rather than shipping a blank page.
      - name: Build
        working-directory: docs/experience
        env:
          BASE_PATH: /x.uma
        run: bun run build

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cargo.lock is committed (D-031), so there is nothing to resolve first.
      #
      # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml for this job only. The
      # pin is for building x.uma; it should not constrain which version of a
      # CI tool can be installed.
      - uses: rustsec/audit-check@v2
        env:
          RUSTUP_TOOLCHAIN: stable
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: rumi

  codegen:
    name: codegen is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint the protos
        run: buf lint

      # Generated code is committed (DECISIONS.md D-028), which is honest only
      # if regenerating reproduces it exactly.
      #
      # scripts/gen.sh rather than `just gen`, so this job needs no `just`. The
      # justfile recipe calls the same script, so there is one source.
      - name: Regenerate
        run: ./scripts/gen.sh

      - name: Assert no drift
        run: |
          if ! git diff --quiet; then
            echo "::error::just gen changed tracked files - generated code is stale, or a plugin pin moved"
            git diff --stat
            git diff | head -100
            exit 1
          fi
          echo "codegen is byte-identical to what is committed"

  crust-python:
    name: crust (PyO3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5

      # maturin is a build tool, not a project dependency, so `uv run maturin`
      # cannot find it until it is installed into the environment.
      #
      # `fixtures` and `bench` are for this test build only; the wheel ships
      # with neither. --benchmark-disable runs each benchmark once as a test.
      - name: Build and test
        working-directory: rumi/crusts/python
        run: |
          uv sync --all-groups
          uv pip install maturin
          uv run maturin develop --uv --features fixtures,bench
          uv run pytest tests/ -q --benchmark-disable

  crust-wasm:
    name: crust (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.15.0

      # `fixtures` and `bench` are for this test build only; the npm package
      # ships with neither. The Rust unit tests run natively and cover the code
      # both crusts share.
      - name: Build and test
        working-directory: rumi/crusts/wasm
        run: |
          wasm-pack build --target web -- --features fixtures,bench
          bun install --frozen-lockfile
          bun test
          cargo test --lib

      - name: Benchmarks still run
        working-directory: rumi/crusts/wasm
        run: |
          bun run bench/floor.bench.ts
          bun run bench/crusty.bench.ts
          bun run bench/config.bench.ts

      # wasm-pack assembles the npm artifact and its generated `files` array
      # omits the licence files. Checked on every PR, not at release time: npm
      # never lets a version be re-uploaded.
      - name: The npm tarball is what the package promises
        run: node scripts/pack-wasm-crust.mjs

  doc-samples:
    name: getting-started and package READMEs run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
      - uses: oven-sh/setup-bun@v2

      # This needs the whole toolchain because the samples import the shipped
      # packages, not the sources: a sample checked against anything other than
      # the artifact a reader installs proves nothing.
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.15.0

      - name: Build the wasm crust
        working-directory: rumi/crusts/wasm
        run: |
          wasm-pack build --target web
          bun install --frozen-lockfile

      - name: Build the python crust
        working-directory: rumi/crusts/python
        run: |
          uv sync --all-groups
          uv run maturin develop --uv

      # --require-all: an environment skip becomes a failure.
      - name: Every sample runs as written
        run: node scripts/check-doc-samples.mjs --require-all

      # The README says "one config, all runtimes" and shows three code blocks;
      # this checks they return the same answers. Runs here because it needs
      # both crusts built.
      - name: Evaluate the README config everywhere
        run: node scripts/check-readme-agreement.mjs
