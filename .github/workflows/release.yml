name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run (skip actual publish)"
        type: boolean
        default: false

permissions:
  contents: write  # needed to create tag

jobs:
  # ── Read version + create tag ─────────────────────────────────────
  tag:
    name: Create release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from Cargo workspace
        id: version
        run: |
          VERSION=$(grep '^version' rumi/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Verify versions match across packages
        env:
          EXPECTED: ${{ steps.version.outputs.version }}
        run: |
          PUMA=$(grep '^version' puma/pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          BUMI=$(node -p "require('./bumi/package.json').version")
          echo "Rust:       $EXPECTED"
          echo "Python:     $PUMA"
          echo "TypeScript: $BUMI"
          if [ "$PUMA" != "$EXPECTED" ] || [ "$BUMI" != "$EXPECTED" ]; then
            echo "::error::Version mismatch! All packages must have the same version."
            exit 1
          fi

      - name: Check tag doesn't already exist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists."
            exit 1
          fi

      - name: Create and push tag
        if: inputs.dry-run == false
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

  # ── Rust → crates.io ──────────────────────────────────────────────
  rust:
    name: Publish Rust crates
    needs: tag
    runs-on: ubuntu-latest
    env:
      # Publish order — dependencies first. `cargo publish` runs a verification
      # build that resolves from crates.io, so a crate cannot go up before the
      # crates it depends on, and a half-finished release cannot be retried:
      # a version, once uploaded, can never be re-used.
      #
      # This list is the single source of that order. It is not trusted on its
      # own — `scripts/check-publishable.mjs` asserts on every PR that it holds
      # every publishable workspace crate and that the order is topological.
      # It previously held three of the five, and rumi-cli depends on both of
      # the missing ones.
      CRATES: rumi/core rumi/proto rumi/ext/kv rumi/ext/http rumi/cli
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            rumi/target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Dry run all crates
        if: inputs.dry-run == true
        run: |
          for CRATE in $CRATES; do
            echo "::group::dry-run $CRATE"
            cargo publish --manifest-path "$CRATE/Cargo.toml" --dry-run
            echo "::endgroup::"
          done

      - name: Publish all crates
        if: inputs.dry-run == false
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for CRATE in $CRATES; do
            echo "::group::publish $CRATE"
            cargo publish --manifest-path "$CRATE/Cargo.toml"
            echo "::endgroup::"
            # crates.io indexes asynchronously; the next crate's verification
            # build resolves this one from the index, not from the local path.
            sleep 30
          done

  # ── Python (xuma) → PyPI ──────────────────────────────────────────
  python:
    name: Publish xuma to PyPI
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # trusted publisher OIDC
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build
        run: uv build
        working-directory: puma

      - name: Publish to PyPI
        if: inputs.dry-run == false
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: puma/dist/

      - name: Dry run
        if: inputs.dry-run == true
        run: ls -la puma/dist/

  # ── TypeScript (xuma) → npm ───────────────────────────────────────
  npm:
    name: Publish xuma to npm
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install deps
        run: bun install --frozen-lockfile
        working-directory: bumi

      - name: Publish
        if: inputs.dry-run == false
        run: bun publish --access public
        working-directory: bumi
        env:
          BUN_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run
        if: inputs.dry-run == true
        run: bun publish --access public --dry-run
        working-directory: bumi
