name: Deploy Docs

# One app, one build, one deploy. The docs site is a single SvelteKit app
# (adapter-static) that carries the playground as its /playground route.
# mdBook was retired on 2026-08-12; the standalone playground app was folded in
# the same day (see DECISIONS.md D-024).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rumi

      # bumi is a local file dep and bun copies it at install time, so its
      # dist/ must exist before the docs app installs.
      - name: Build bumi
        working-directory: bumi
        run: bun install --frozen-lockfile && bun run build

      - name: Build docs site
        working-directory: docs/experience
        env:
          BASE_PATH: ${{ github.event_name == 'pull_request' && format('/x.uma/pr-preview/pr-{0}', github.event.number) || '/x.uma' }}
        run: bun install && bun run build

      - name: Build Rust API docs
        run: cargo doc --manifest-path rumi/Cargo.toml --no-deps

      - name: Assemble site
        run: |
          mkdir -p site
          cp -r docs/experience/build/. site/
          mkdir -p site/api/rust && cp -r rumi/target/doc/. site/api/rust/
          echo "assembled:" && ls site

      - name: Deploy PR preview
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview

      - name: Deploy to gh-pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          keep_files: true
